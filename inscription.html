                    <input type="text" id="prenom" name="prenom" class="form-control bg-dark text-white border-secondary" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label text-muted-custom small fw-bold">email</label>

                    </div>
                    <div class="mb-2">

                        <input type="text" id="tel_etudiant" name="tel" class="form-control bg-dark text-white border-secondary">

                    <div class="mb-2">

                    </div>
                    <div class="mb-2">
                        <label for="promo" class="form-label text-muted-custom small">promo</label>

                    <div class="mb-2">
                        <label for="gp_td" class="form-label text-muted-custom small">gp_td</label>

                    </div>
                    <div class="mb-2">

                <div id="fields-enseignant" class="role-fields mb-4 p-3 rounded" style="display: none; background-color: #0d1117; border: 1px dashed #30363d;">
                    <h6 class="text-primary mb-3"><i class="bi bi-person-workspace me-2"></i>Informations Enseignant</h6>
                    <div class="mb-2">
                        <label for="role_enseignant" class="form-label text-muted-custom small">role (Admin, Responsable, Jury, etc.)</label>
                        <input type="text" id="role_enseignant" name="role_enseignant" class="form-control bg-dark text-white border-secondary">
                    </div>
                </div>
                <div id="fields-maitre" class="role-fields mb-4 p-3 rounded" style="display: none; background-color: #0d1117; border: 1px dashed #30363d;">
                    <h6 class="text-primary mb-3"><i class="bi bi-building me-2"></i>Informations Maître de Stage</h6>
                    <div class="mb-2">
                        <label for="tel_maitre" class="form-label text-muted-custom small">tel</label>

                    <div class="mb-2">

                    <input type="password" id="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label text-muted-custom small fw-bold">confirmation de mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control bg-dark text-white border-secondary" required>
                    <div id="error-msg" class="text-danger small mt-2" style="display: none;">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Les mots de passe ne correspondent pas.

                    </p>
                </div>
            </div>
        </div>
    </footer>
    <script>
        function showRoleFields() {
            const selectedRole = document.getElementById('role').value;
            
            // Masquer tous les blocs spécifiques et enlever 'required' des inputs et selects
            document.querySelectorAll('.role-fields').forEach(block => {
                block.style.display = 'none';
                block.querySelectorAll('input, select').forEach(element => element.removeAttribute('required'));
            });

            // Afficher le bloc sélectionné et ajouter 'required' à ses éléments enfants
            if (selectedRole) {
                const activeBlock = document.getElementById(`fields-${selectedRole}`);
                activeBlock.style.display = 'block';
                activeBlock.querySelectorAll('input, select').forEach(element => element.setAttribute('required', 'true'));
            }
        }

        // Vérification correspondance mots de passe
        document.getElementById('accountForm').addEventListener('submit', function(e) {
            const pass = document.getElementById('password').value;
            const confirmPass = document.getElementById('confirm_password').value;
            const error = document.getElementById('error-msg');

            if (pass !== confirmPass) {
                e.preventDefault();
                error.style.display = 'block';
            } else {
                error.style.display = 'none';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
